name: Image standard check
on:
  pull_request:
    paths: ['**.html', '**.css', '**.js', 'assets/**']
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 tools/optimise_images.py --check
